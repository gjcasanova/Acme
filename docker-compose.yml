services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - fleet-data:/app/data
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  fleet-data:
